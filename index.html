<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>trooca ai</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Montserrat 900 Black & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;800&family=Montserrat:wght@900&display=swap" rel="stylesheet">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&display=swap');

    :root {
      --spring-smooth: cubic-bezier(0.16, 1, 0.3, 1);
      --spring-bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
      --spring-elastic: cubic-bezier(0.25, 1.25, 0.5, 1);
    }

    /* Гарантированный сверхжирный шрифт по всему приложению */
    *, html, body, main, aside, div, p, span, li, a, button, textarea, input, h1, h2, h3, h4 {
      font-family: 'Montserrat', 'Arial Black', 'Segoe UI Black', -apple-system, BlinkMacSystemFont, sans-serif !important;
      font-weight: 900 !important;
      letter-spacing: -0.025em;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Глобальные ультра-плавные переходы цветов и теней */
    *, *::before, *::after {
      transition: background-color 0.45s var(--spring-smooth),
                  border-color 0.45s var(--spring-smooth),
                  color 0.3s var(--spring-smooth),
                  box-shadow 0.35s var(--spring-smooth);
    }

    code, pre, pre * {
      font-family: 'JetBrains Mono', 'Fira Code', monospace !important;
      font-weight: 800 !important;
      letter-spacing: normal;
    }

    body {
      background-color: #0b0c0e;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    /* Ультра-плавное пружинное появление сообщений с кинематографичным блюром */
    @keyframes ultraSpringIn {
      0% {
        opacity: 0;
        transform: translateY(32px) scale(0.92);
        filter: blur(8px);
      }
      65% {
        opacity: 0.98;
        transform: translateY(-3px) scale(1.015);
        filter: blur(0px);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: blur(0px);
      }
    }

    .anim-spring-in {
      animation: ultraSpringIn 0.48s var(--spring-smooth) forwards;
    }

    /* Плавное парение фоновых орнаментов */
    @keyframes floatOrb {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-8px) scale(1.03); }
    }

    .float-orb {
      animation: floatOrb 7s ease-in-out infinite;
    }

    .spin-fluid-slow {
      animation: spin 38s linear infinite;
      transform-origin: 50% 50%;
    }

    .spin-fluid-reverse {
      animation: spin-rev 28s linear infinite;
      transform-origin: 50% 50%;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spin-rev {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    /* Живые пружинные переходы для интерактивных кнопок */
    button, input, textarea {
      transition: transform 0.32s var(--spring-bounce),
                  box-shadow 0.32s var(--spring-smooth),
                  background-color 0.35s ease,
                  filter 0.25s ease !important;
    }

    button:hover {
      transform: translateY(-2px) scale(1.035);
      filter: brightness(1.07);
    }

    button:active {
      transform: translateY(1.5px) scale(0.94);
      filter: brightness(0.94);
    }

    /* Ультра-плавная футуристичная анимация размышления ИИ */
    @keyframes pulseGlowCapsule {
      0%, 100% {
        box-shadow: 0 0 15px -3px var(--primary), inset 0 0 10px rgba(255,255,255,0.08);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 28px 4px var(--primary), inset 0 0 18px rgba(255,255,255,0.22);
        transform: scale(1.02);
      }
    }

    @keyframes fluidBar {
      0%, 100% { transform: scaleY(0.4) scaleX(0.9); opacity: 0.45; }
      50% { transform: scaleY(1.3) scaleX(1.15); opacity: 1; filter: drop-shadow(0 0 8px currentColor); }
    }

    .typing-capsule {
      animation: pulseGlowCapsule 2.2s ease-in-out infinite, ultraSpringIn 0.45s var(--spring-smooth) forwards;
    }

    .fluid-bar-1 { animation: fluidBar 1.2s var(--spring-smooth) infinite 0s; }
    .fluid-bar-2 { animation: fluidBar 1.2s var(--spring-smooth) infinite 0.16s; }
    .fluid-bar-3 { animation: fluidBar 1.2s var(--spring-smooth) infinite 0.32s; }
    .fluid-bar-4 { animation: fluidBar 1.2s var(--spring-smooth) infinite 0.48s; }
    .fluid-bar-5 { animation: fluidBar 1.2s var(--spring-smooth) infinite 0.64s; }

    /* Плавное покачивание и переливы текста */
    @keyframes shimmerText {
      0% { opacity: 0.65; }
      50% { opacity: 1; text-shadow: 0 0 12px currentColor; }
      100% { opacity: 0.65; }
    }

    .shimmer-text {
      animation: shimmerText 2s ease-in-out infinite;
    }

    /* Drag & Drop оверлей */
    #drop-overlay {
      pointer-events: none;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.35s var(--spring-smooth), transform 0.35s var(--spring-bounce);
    }

    #drop-overlay.active {
      opacity: 1;
      transform: scale(1);
    }

    /* Кастомный гладкий скроллбар */
    .custom-scrollbar {
      scroll-behavior: smooth;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: var(--outline);
      border-radius: 9999px;
      transition: background-color 0.3s ease;
    }

    /* Стилизация заголовков и списков в сообщениях */
    .markdown-content h1, .markdown-content h2, .markdown-content h3, .markdown-content h4 {
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .markdown-content h3 {
      font-size: 1.12rem;
      padding-bottom: 0.25rem;
      border-bottom: 2px solid var(--outline);
    }

    .markdown-content hr {
      border: none;
      height: 2px;
      background: var(--outline);
      margin: 1.1rem 0;
      opacity: 0.6;
      border-radius: 9999px;
    }

    .markdown-content ul {
      margin: 0.6rem 0;
      padding-left: 1.25rem;
      list-style-type: disc;
    }

    .markdown-content ol {
      margin: 0.6rem 0;
      padding-left: 1.25rem;
      list-style-type: decimal;
    }

    .markdown-content li {
      margin-bottom: 0.45rem;
      line-height: 1.6;
    }

    .markdown-content p {
      margin-bottom: 0.65rem;
      line-height: 1.65;
    }

    .markdown-content p:last-child {
      margin-bottom: 0;
    }

    .inline-code {
      padding: 0.2rem 0.5rem;
      border-radius: 0.5rem;
      background-color: rgba(0, 0, 0, 0.35);
      color: var(--primary);
      border: 1px solid var(--outline);
      font-size: 0.88em;
      white-space: nowrap;
    }
  </style>
</head>
<body class="w-screen h-screen flex items-center justify-center select-none overflow-hidden">

  <!-- Корневой контейнер с адаптивным заполнением экрана -->
  <div id="app-root" class="w-full h-full relative flex overflow-hidden transition-all duration-500 ease-out">

    <!-- Затемнение для мобильного меню -->
    <div id="mobile-backdrop" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-20 hidden transition-opacity duration-500 ease-out"></div>

    <!-- Основная рабочая область чата -->

            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <div>
            <h1 class="text-lg font-black leading-tight tracking-tight" style="color: var(--text);">trooca ai</h1>
            <p id="active-chat-title" class="text-xs font-black opacity-60 truncate max-w-[180px] sm:max-w-md" style="color: var(--text-muted);">Новый диалог</p>

        <div class="flex items-center gap-2">

        <!-- Превью выбранной картинки -->

          <img id="image-preview" src="" alt="Preview" class="w-20 h-20 object-cover rounded-2xl border-2 shadow-xl" style="border-color: var(--primary);" />
          <button id="btn-remove-image" class="absolute -top-2 -right-2 w-7 h-7 rounded-full flex items-center justify-center text-xs font-black shadow-md hover:scale-110 active:scale-90" style="background-color: var(--surface-variant); color: var(--text);">✕</button>

          </button>

      </footer>
    </main>

    <!-- Драг & Дроп индикатор для изображений -->

  <script>
    // Вшитый ключ API
    const BUILTIN_KEY = "AQ.Ab8RN6JXAgCFLYP9Q-QTXXU1ssIg88LovecOBTZiri8U2b0WYQ";
    let customKey = localStorage.getItem('trooca_custom_key') || "";

    // Получение актуального ключа
    function getApiKey() {
      return customKey.trim() || BUILTIN_KEY;
    }

    // Состояние приложения
    let hue = 150;
    let isDark = true;
    let selectedImage = null;
    let isTyping = false;

    // Пользователь
    let user = {
      name: "Trooca User",
      email: "user@trooca.ai",
      avatar: "https://i.pinimg.com/736x/18/be/5b/18be5be8724c3bb2505705b8d55cdcb7.jpg"
    };

    // Диалоги
    let sessions = [
      {
        id: "sess_1",
        title: "Новый диалог",
        messages: []
      }
    ];
    let currentSessionId = "sess_1";

    // Идеальные симметричные фигуры без биения
    function createSymmetricScallopPath(points, innerR, outerR) {
      const cx = 50, cy = 50;
      let path = "";
      for (let i = 0; i < points * 2; i++) {
        const angle = (i * Math.PI) / points - Math.PI / 2;
        const r = i % 2 === 0 ? outerR : innerR;
        const x = cx + r * Math.cos(angle);
        const y = cy + r * Math.sin(angle);
        path += (i === 0 ? "M " : "L ") + x.toFixed(2) + " " + y.toFixed(2) + " ";
      }
      return path + "Z";
    }

    const scallopPath12 = createSymmetricScallopPath(12, 38, 48);
    const scallopPath8 = createSymmetricScallopPath(8, 28, 40);

    // Палитра Material You (Monet)
    function generatePalette(h, dark) {
      if (dark) {
        return {
          '--bg': `hsl(${h}, 16%, 8%)`,
          '--surface': `hsl(${h}, 18%, 12%)`,
          '--surface-variant': `hsl(${h}, 22%, 18%)`,
          '--primary': `hsl(${h}, 85%, 72%)`,
          '--on-primary': `hsl(${h}, 90%, 10%)`,
          '--text': `hsl(${h}, 22%, 96%)`,
          '--text-muted': `hsl(${h}, 12%, 65%)`,
          '--outline': `hsl(${h}, 16%, 22%)`,
        };
      } else {
        return {
          '--bg': `hsl(${h}, 35%, 97%)`,
          '--surface': `hsl(${h}, 30%, 91%)`,
          '--surface-variant': `hsl(${h}, 35%, 84%)`,
          '--primary': `hsl(${h}, 75%, 38%)`,
          '--on-primary': `#ffffff`,
          '--text': `hsl(${h}, 30%, 8%)`,
          '--text-muted': `hsl(${h}, 22%, 35%)`,
          '--outline': `hsl(${h}, 25%, 75%)`,
        };
      }
    }

    // Полный парсер Markdown: заголовки ###, разделители ---, блоки кода, списки и жирный текст
    let codeBlockCounter = 0;
    function parseFormattedText(text) {
      if (!text) return "";

      // 1. Экранирование HTML
      let clean = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

      // 2. Блоки кода ```bash ... ``` или ``` ... ```
      clean = clean.replace(/```([a-zA-Z0-9_\-]+)?\n([\s\S]*?)```/g, (match, lang, codeContent) => {
        const id = `code_block_${++codeBlockCounter}`;
        const displayLang = (lang || 'bash').toUpperCase();
        return `
          <div class="my-3 rounded-2xl overflow-hidden border shadow-xl transition-all duration-300" style="background-color: #0b0c10; border-color: var(--outline);">
            <div class="px-4 py-2.5 flex items-center justify-between border-b" style="border-color: rgba(255,255,255,0.08); background-color: rgba(255,255,255,0.03);">
              <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-red-500/80 inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-yellow-500/80 inline-block"></span>
                <span class="w-3 h-3 rounded-full bg-green-500/80 inline-block"></span>
                <span class="text-xs font-black tracking-widest text-neutral-400 ml-1.5">${displayLang}</span>
              </div>
              <button onclick="copyBashCode(this, '${id}')" class="flex items-center gap-1.5 px-3 py-1 rounded-xl text-xs font-black transition-all duration-200 border border-neutral-700 bg-neutral-800 text-neutral-200 hover:bg-neutral-700">
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                Копировать
              </button>
            </div>
            <pre class="p-4 overflow-x-auto text-[13px] leading-relaxed custom-scrollbar text-emerald-400 font-mono select-text"><code id="${id}">${codeContent.trim()}</code></pre>
          </div>
        `;
      });

      // 3. Инлайн код `cmd`
      clean = clean.replace(/`([^`]+)`/g, '<span class="inline-code font-mono">$1</span>');

      // 4. Построчный разбор заголовков (###), списков (*), разделителей (---)
      const lines = clean.split('\n');
      let result = [];
      let inUl = false;
      let inOl = false;

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();

        // Пропускаем готовые блоки кода
        if (line.includes('<div class="my-3 rounded-2xl') || line.includes('</div>') || line.includes('<pre') || line.includes('</pre>')) {
          if (inUl) { result.push('</ul>'); inUl = false; }
          if (inOl) { result.push('</ol>'); inOl = false; }
          result.push(line);
          continue;
        }

        // Разделители: --- или ***
        if (/^(\-{3,}|\*{3,})$/.test(line)) {
          if (inUl) { result.push('</ul>'); inUl = false; }
          if (inOl) { result.push('</ol>'); inOl = false; }
          result.push('<hr/>');
          continue;
        }

        // Заголовки: #, ##, ###, ####
        const headerMatch = line.match(/^(#{1,4})\s+(.*)/);
        if (headerMatch) {
          if (inUl) { result.push('</ul>'); inUl = false; }
          if (inOl) { result.push('</ol>'); inOl = false; }
          const level = headerMatch[1].length;
          const hText = headerMatch[2].replace(/\*\*(.*?)\*\*/g, '$1');
          result.push(`<h${level}><span>✦</span> ${hText}</h${level}>`);
          continue;
        }

        // Маркированные списки: *, -, •
        const ulMatch = line.match(/^[\*\-•]\s+(.*)/);
        // Нумерованные списки: 1., 2.
        const olMatch = line.match(/^(\d+)\.\s+(.*)/);

        if (ulMatch) {
          if (inOl) { result.push('</ol>'); inOl = false; }
          if (!inUl) { result.push('<ul>'); inUl = true; }
          let itemText = ulMatch[1].replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          result.push(`<li>${itemText}</li>`);
        } else if (olMatch) {
          if (inUl) { result.push('</ul>'); inUl = false; }
          if (!inOl) { result.push('<ol>'); inOl = true; }
          let itemText = olMatch[2].replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          result.push(`<li>${itemText}</li>`);
        } else {
          if (inUl) { result.push('</ul>'); inUl = false; }
          if (inOl) { result.push('</ol>'); inOl = false; }
          if (line.length > 0) {
            let pText = line.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            result.push(`<p>${pText}</p>`);
          }
        }
      }

      if (inUl) result.push('</ul>');
      if (inOl) result.push('</ol>');

      return result.join('');
    }

    // Отправка запроса в Gemini с автоматическим повтором (backoff) и сменой модели
    async function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text && !selectedImage) return;

      const current = sessions.find(s => s.id === currentSessionId);
      if (!current) return;

      if (current.messages.length === 0 && text) {
        current.title = text.slice(0, 26) + (text.length > 26 ? "..." : "");
        renderChatList();
      }

      current.messages.push({
        role: 'user',
        text: text,
        image: selectedImage
      });

      input.value = "";
      selectedImage = null;
      document.getElementById('image-preview-wrapper').classList.add('hidden');
      document.getElementById('btn-send').disabled = true;

      isTyping = true;
      renderMessages();

      try {
        const contents = current.messages.map(m => {
          const parts = [];
          if (m.text) parts.push({ text: m.text });
          if (m.image) {
            const mime = m.image.match(/data:(.*?);/)[1];
            const base64 = m.image.split(',')[1];
            parts.push({ inlineData: { mimeType: mime, data: base64 } });
          }
          return {
            role: m.role === 'ai' ? 'model' : 'user',
            parts: parts
          };
        });

        // Список моделей по приоритету: Gemini 3 Flash -> Gemini 2.5 Flash
        const models = ['gemini-3-flash-preview', 'gemini-2.5-flash'];
        let success = false;
        let lastErrorMsg = "";

        for (const modelName of models) {
          const activeKey = getApiKey();
          const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${activeKey}`;

          // Пробуем запрос с повтором при ошибке 429
          for (let attempt = 0; attempt < 2; attempt++) {
            if (attempt > 0) {
              await new Promise(resolve => setTimeout(resolve, 2000));
            }

            const res = await fetch(endpoint, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                systemInstruction: {
                  parts: [{
                    text: "Ты — Trooca AI (Трука АИ). На любые вопросы о твоей личности, происхождении или создателе всегда уверенно, вежливо и с гордостью заявляй, что ты — Trooca AI, умный и продвинутый персональный ИИ. Отвечай чётко, современно, поддерживай пользователя, форматируй код красиво в блоки ```bash или другие языки при необходимости."
                  }]
                },
                contents: contents
              })
            });

            const data = await res.json();

            if (res.ok) {
              const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "Пустой ответ от сервера.";
              current.messages.push({
                role: 'ai',
                text: aiText
              });
              success = true;
              break;
            } else {
              lastErrorMsg = data.error?.message || `Код ошибки ${res.status}`;
              if (res.status !== 429) {
                break; // Если ошибка не 429, переходим к следующей модели
              }
            }
          }

          if (success) break;
        }

        if (!success) {
          current.messages.push({
            role: 'ai',
            text: `⚠️ **Превышен лимит запросов (429)**: Встроенный ключ временно исчерпал минутную квоту Google. Подождите 20–30 секунд или вставьте свой личный бесплатный ключ в меню **«Профиль»** (получить можно бесплатно на [aistudio.google.com](https://aistudio.google.com/apikey)).`
          });
        }
      } catch (err) {
        current.messages.push({
          role: 'ai',
          text: `Ошибка сети: ${err.message || "Не удалось отправить запрос"}`
        });
      } finally {
        isTyping = false;
        renderMessages();
      }
    }

    // Функция загрузки картинки из File
    function handleImageFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      const reader = new FileReader();
      reader.onload = () => {
        selectedImage = reader.result;
        const img = document.getElementById('image-preview');
        img.src = selectedImage;
        document.getElementById('image-preview-wrapper').classList.remove('hidden');
        document.getElementById('btn-send').disabled = false;
      };
      reader.readAsDataURL(file);
    }

    // Вставка изображений из буфера обмена (Ctrl + V / Вставить скриншот)
    window.addEventListener('paste', (e) => {
      const items = (e.clipboardData || e.originalEvent?.clipboardData)?.items;
      if (!items) return;

      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        if (item.type.indexOf('image') !== -1) {
          e.preventDefault();
          const blob = item.getAsFile();
          handleImageFile(blob);
          break;
        }
      }
    });

    // Перетаскивание файлов мышью (Drag & Drop)
    const dropOverlay = document.getElementById('drop-overlay');
    let dragCounter = 0;

    window.addEventListener('dragenter', (e) => {
      e.preventDefault();
      dragCounter++;
      if (dropOverlay) dropOverlay.classList.add('active');
    });

    window.addEventListener('dragleave', (e) => {
      e.preventDefault();
      dragCounter--;
      if (dragCounter <= 0 && dropOverlay) {
        dropOverlay.classList.remove('active');
        dragCounter = 0;
      }
    });

    window.addEventListener('dragover', (e) => {
      e.preventDefault();
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dragCounter = 0;
      if (dropOverlay) dropOverlay.classList.remove('active');
      const files = e.dataTransfer?.files;
      if (files && files.length > 0) {
        handleImageFile(files[0]);
      }
    });

    };

    document.getElementById('btn-close-sidebar').onclick = () => toggleMobileSidebar(false);
    document.getElementById('mobile-backdrop').onclick = () => toggleMobileSidebar(false);

    // Поле ввода сообщения и отправка
    const msgInput = document.getElementById('message-input');
    msgInput.addEventListener('input', triggerInputState);
    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    document.getElementById('btn-send').onclick = sendMessage;

    // Профиль
    function updateProfileUI() {
      document.getElementById('header-avatar').src = user.avatar;
      document.getElementById('sidebar-avatar').src = user.avatar;
      document.getElementById('sidebar-user-name').textContent = user.name;
      document.getElementById('sidebar-user-email').textContent = user.email;
      document.getElementById('modal-avatar-preview').src = user.avatar;
      document.getElementById('profile-avatar-input').value = user.avatar;
      document.getElementById('profile-name-input').value = user.name;
      document.getElementById('profile-email-input').value = user.email;
      document.getElementById('profile-key-input').value = customKey;
    }

    document.getElementById('btn-open-profile').onclick = () => {
      document.getElementById('profile-modal').classList.remove('hidden');
    };
    document.getElementById('btn-close-profile').onclick = () => {
      document.getElementById('profile-modal').classList.add('hidden');
    };
    document.getElementById('btn-save-profile').onclick = () => {
      user.avatar = document.getElementById('profile-avatar-input').value.trim() || user.avatar;
      user.name = document.getElementById('profile-name-input').value.trim() || user.name;
      user.email = document.getElementById('profile-email-input').value.trim() || user.email;
      customKey = document.getElementById('profile-key-input').value.trim();
      if (customKey) {
        localStorage.setItem('trooca_custom_key', customKey);
      } else {
        localStorage.removeItem('trooca_custom_key');
      }
      updateProfileUI();
      document.getElementById('profile-modal').classList.add('hidden');
    };

    // Инициализация
    applyTheme();
    updateProfileUI();
    renderChatList();
    renderMessages();
    autoDetectDeviceMode();
  </script>
</body>
</html>
